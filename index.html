<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Love You Malika - Firework Heart Experience</title>
    <meta name="description" content="A breathtaking, cinematic interactive romantic night sky experience dedicated to Malika, with realistic firework sounds, heart burst, and celestial love confession." />
    <meta property="og:title" content="I Love You Malika - Firework Heart Experience" />
    <meta property="og:description" content="A breathtaking, cinematic interactive romantic night sky experience dedicated to Malika." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts for High-Character Romantic & Display Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Pure CSS Stylesheet -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Full-screen Canvas for Stars, Fireworks, Heart Burst, Circle Morph & Sparks -->
    <canvas id="sky-canvas"></canvas>

    <!-- Atmospheric Glow & Film Grain Overlays -->
    <div class="atmosphere-overlay" aria-hidden="true"></div>
    <div class="film-grain" aria-hidden="true"></div>
    <div id="meteor-flash" aria-hidden="true"></div>

    <!-- Status / Announcement Banner -->
    <div id="constellation-banner" role="status" aria-live="polite">
      ✦ Yurak Salyuti Charx Urdi — I Love You Malika ✦
    </div>

    <!-- Audio player for user's requested song -->
    <audio id="bg-music" src="/audio/tv_girl_blue_hair.mp3" preload="auto" loop></audio>

    <!-- Top Navigation HUD: Ambient Romantic Music & Sound Effects -->
    <header class="top-hud">
      <button id="btn-music" class="btn-ambient-music" aria-label="Toggle romantic music and sound effects">
        <span class="audio-waves" aria-hidden="true">
          <span class="audio-bar"></span>
          <span class="audio-bar"></span>
          <span class="audio-bar"></span>
          <span class="audio-bar"></span>
        </span>
        <span class="music-label">Ovoz & Musiqa</span>
      </button>
    </header>

    <!-- Cinematic Viewport Content: Revealed inside the Firework Circle -->
    <main id="cinematic-viewport">
      <div class="scene-wrapper">
        <!-- Ethereal Celestial Halo / Aura behind Malika's name -->
        <div class="celestial-center-aura" aria-hidden="true"></div>

        <!-- Main Romantic Dedication -->
        <article class="romantic-sanctuary" aria-label="Romantic love confession for Malika">
          <div class="celestial-ornament" aria-hidden="true">
            <span class="ornament-line"></span>
            <span class="ornament-star">✦</span>
            <span class="ornament-line"></span>
          </div>

          <h1 id="romantic-headline" class="romantic-headline">
            <span class="headline-prefix">I LOVE YOU</span>
            <span class="headline-name">MALIKA</span>
          </h1>

          <p id="romantic-subline" class="romantic-subline">
            More than words could ever explain.
          </p>

          <p id="romantic-devotion" class="romantic-devotion">
            "You are the most beautiful part of my story, my eternal star."
          </p>

          <div class="celestial-ornament bottom-ornament" aria-hidden="true">
            <span class="ornament-line"></span>
            <span class="ornament-heart">❤</span>
            <span class="ornament-line"></span>
          </div>
        </article>
      </div>
    </main>

    <!-- Bottom Interactive Controls Deck -->
    <footer id="bottom-deck" class="bottom-deck">
      <div class="action-buttons-group">
        <button id="btn-firework" class="btn-action" aria-label="Salyut otish - Launch Heart Firework">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
          </svg>
          <span>Salyut Otish (Firework)</span>
        </button>

        <button id="btn-replay" class="btn-action" aria-label="Replay the grand sequence">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
          <span>Replay Story</span>
        </button>
      </div>
      <p class="interaction-hint">Ekranga bosing — salyut, yulduzlar va yuraklar ovozi yangraydi 🔊✨</p>
    </footer>

    <!-- Pure Vanilla JavaScript Engine -->
    <script type="module" src="./script.js"></script>
  </body>
</html>
